name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build static artifact
        run: |
          mkdir -p _site/measure_admin _site/tailor _site/client _site/shared
          cp index.html _site/index.html
          cp shared/workflow.js _site/shared/
          cp measure_admin/index.html measure_admin/app.js measure_admin/catalog.js measure_admin/styles.css _site/measure_admin/
          cp tailor/index.html tailor/app.js tailor/products.js tailor/styles.css _site/tailor/
          cp client/index.html client/app.js client/styles.css _site/client/
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
